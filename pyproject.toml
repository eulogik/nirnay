[project]
name = "nirnay"
version = "0.1.0"
description = "NIRNAY: small calibrated decision model, Banking77 87.9% (Jev/Laya-compatible wire format)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Eulogik", email = "info@eulogik.com" },
]
keywords = [
    "banking77",
    "intent-classification",
    "text-classification",
    "calibrated-decisions",
    "decision-model",
    "system-one",
    "laya",
    "small-language-model",
    "edge-ai",
    "lora",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.48.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "numpy>=1.26.0",
    "laya>=0.3.5",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
nirnay-server = "nirnay.server:main"
nirnay-train = "nirnay.train:main"

[project.urls]
Homepage = "https://eulogik.com"
Repository = "https://github.com/eulogik/nirnay"
Documentation = "https://github.com/eulogik/nirnay/blob/main/README.md"
"Bug Tracker" = "https://github.com/eulogik/nirnay/issues"
"Model Weights" = "https://huggingface.co/eulogik/nirnay-450m"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nirnay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
