[project]
name = "nirnay"
version = "0.1.0"
description = "NIRNAY-1 — System 1.5 calibrated decision model (Jev/Laya-compatible)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.48.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "numpy>=1.26.0",
    "laya>=0.3.5",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
nirnay-server = "nirnay.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nirnay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
